<!doctype html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Segui Marco Buttaci sui social." />
    <title>Social — Marco Buttaci</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="content-page social-page">
      <a class="back-link" href="index.html">← TORNA ALLA HOME</a>
      <p class="eyebrow">02 / SOCIAL</p>
      <h1>SOCIAL</h1>
      <div class="social-cards">
        <a
          class="social-card"
          href="https://www.instagram.com/"
          target="_blank"
          rel="noreferrer"
        >
          <span class="social-number">01</span>
          <span class="social-name">Instagram</span>
          <span class="social-arrow" aria-hidden="true">↗</span>
        </a>
        <a
          class="social-card"
          href="https://www.youtube.com/"
          target="_blank"
          rel="noreferrer"
        >
          <span class="social-number">02</span>
          <span class="social-name">YouTube</span>
          <span class="social-arrow" aria-hidden="true">↗</span>
        </a>
        <a
          class="social-card"
          href="https://open.spotify.com/"
          target="_blank"
          rel="noreferrer"
        >
          <span class="social-number">03</span>
          <span class="social-name">Spotify</span>
          <span class="social-arrow" aria-hidden="true">↗</span>
        </a>
      </div>
    </main>
  </body>
</html>
