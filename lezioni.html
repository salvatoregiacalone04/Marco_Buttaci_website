<!doctype html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Contatta Marco Buttaci per informazioni sulle lezioni."
    />
    <title>Lezioni — Marco Buttaci</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="lesson-page">
      <a class="back-link" href="index.html">← TORNA ALLA HOME</a>
      <p class="eyebrow lesson-eyebrow">02 / LEZIONI</p>
      <header class="lesson-header">
        <h1>LEZIONI AL SAX</h1>
      </header>

      <details class="lesson-accordion">
        <summary>INFO LEZIONI</summary>
        <ul class="lesson-info-list">
          <li>
            <strong>Luogo</strong><span>Online o in presenza a Marsala</span>
          </li>
          <li><strong>Durata</strong><span>Un'ora</span></li>
          <li><strong>Costo</strong><span>15 € all'ora</span></li>
          <li><strong>Materiale didattico</strong><span>Incluso</span></li>
          <li>
            <strong>Primo incontro</strong><span>Conoscitivo e gratuito</span>
          </li>
        </ul>
      </details>

      <details class="lesson-accordion lesson-cta">
        <summary><span>PRENOTA IL TUO PRIMO INCONTRO GRATUITO</span></summary>
        <form class="contact-form" action="/api/contatto" method="post">
          <div class="field">
            <label for="nome">Nome e cognome *</label>
            <input
              id="nome"
              name="nome"
              type="text"
              autocomplete="name"
              required
            />
          </div>
          <div class="field">
            <label for="contatto">Numero di telefono o indirizzo email *</label>
            <input
              id="contatto"
              name="contatto"
              type="text"
              autocomplete="email"
              required
            />
          </div>
          <div class="field">
            <label for="messaggio">Messaggio</label>
            <textarea id="messaggio" name="messaggio" rows="5"></textarea>
          </div>
          <button class="submit-button" type="submit">Invia richiesta</button>
          <p class="form-status" role="status" aria-live="polite"></p>
        </form>
      </details>
    </main>
    <script src="script.js"></script>
  </body>
</html>
